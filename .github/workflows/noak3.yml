name: 编译 raphael 内核（只出 dtb / Image.gz / Image.gz-dtb）

# ============================================================================
# 说明：
#   · 只做「下载工具链 → 检出源码 → 编译 → 收集 3 类产物 → 分开上传」
#   · 产物：全部 .dtb、Image.gz、Image.gz-dtb（三者分开上传，不打 tar 包）
#   · 不集成 KernelSU，不做 AnyKernel3 打包
#   · 换源码 / 分支 / defconfig 只改 jobs.build.env 里的变量
# ============================================================================

on:
  workflow_dispatch:

jobs:
  build:
    name: 编译内核
    runs-on: ubuntu-22.04

    env:
      # ---- 集中配置区 ----
      KERNEL_REPO: https://github.com/kmerc224/kernel_xiaomi_raphael_Helium-Studio.git
      KERNEL_BRANCH: oss-base
      DEFCONFIG: raphael_defconfig
      CLANG_URL: https://github.com/Mandi-Sa/clang/releases/download/amd64-kernel-arm_static-19/llvm19.0.0-binutils2.42_amd64-kernel-arm_static-20240425.7z

    steps:
      # 1. 安装编译依赖（不能装 libyaml-dev，否则 dtc yaml 分支会链接失败）
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git gnupg gperf \
            libncurses-dev libssl-dev lz4 lzop \
            libxml2-utils rsync cpio zlib1g-dev zip unzip p7zip-full \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      # 2. 下载并解压 Clang 工具链
      - name: 下载 Clang 工具链
        run: |
          mkdir -p $HOME/toolchain
          cd $HOME/toolchain
          wget -q "$CLANG_URL"
          F=$(basename "$CLANG_URL")
          7z x -y "$F" >/dev/null
          rm -f "$F"

      # 3. 检出内核源码（并强制 dtc 走 NO_YAML，避开 HOSTLDLIBS/HOSTLOADLIBES 变量名不匹配的链接失败）
      - name: 检出内核源码
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" $HOME/kernel
          cd $HOME/kernel
          sed -i 's/pkg-config --exists yaml-0.1/false/' scripts/dtc/Makefile
          git log -1 --oneline

      # 3.1 集成SukiSU
      - name: 集成 SukiSU Ultra
        run: |
          cd $HOME/kernel
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

      # 4. 编译内核
      - name: 编译内核
        run: |
          cd $HOME/kernel

          # 工具链 bin 目录加入 PATH（clang 与交叉 binutils 可能分开存放）
          for d in $(find $HOME/toolchain -type d -name bin | sort -u); do
            export PATH="$d:$PATH"
          done
          # 删掉工具链自带 host 链接器，避免抢占系统 ld
          for d in $(find $HOME/toolchain -type d -name bin | sort -u); do
            rm -f "$d/ld" "$d/ld.bfd" "$d/ld.gold" "$d/collect2" 2>/dev/null || true
          done

          export ARCH=arm64 SUBARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export HOSTCC=gcc HOSTCXX=g++ HOSTLD=ld

          make O=out "$DEFCONFIG"

          # 按 config 决定是否出压缩 / appended-dtb 镜像，避免“无此规则”报错
          EXTRA=""
          grep -q '^CONFIG_KERNEL_GZIP=y' out/.config && EXTRA="$EXTRA Image.gz"
          grep -q '^CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y' out/.config && EXTRA="$EXTRA Image.gz-dtb"
          echo "== 附加目标：$EXTRA =="

          make O=out -j"$(nproc)" dtbs $EXTRA

      # 5. 收集产物：Image.gz、Image.gz-dtb、全部 .dtb
      - name: 收集产物
        run: |
          cd $HOME/kernel/out/arch/arm64/boot
          mkdir -p $GITHUB_WORKSPACE/dtbs

          cp -v Image.gz     $GITHUB_WORKSPACE/ 2>/dev/null || true
          cp -v Image.gz-dtb $GITHUB_WORKSPACE/ 2>/dev/null || true

          # 保留相对目录结构，避免不同子目录下同名 .dtb 互相覆盖
          find . -type f -name '*.dtb' -print0 | while IFS= read -r -d '' f; do
            rel="${f#./}"
            mkdir -p "$GITHUB_WORKSPACE/dtbs/$(dirname "$rel")"
            cp -v "$f" "$GITHUB_WORKSPACE/dtbs/$rel"
          done

          echo "== 产物清单 =="
          ls -lh $GITHUB_WORKSPACE/Image.gz $GITHUB_WORKSPACE/Image.gz-dtb 2>/dev/null || true
          find $GITHUB_WORKSPACE/dtbs -type f -exec ls -lh {} \;

      # 6. 分开上传（三个独立 Artifact）
      - name: 上传 Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz
          path: Image.gz
          retention-days: 14

      - name: 上传 Image.gz-dtb
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb
          path: Image.gz-dtb
          retention-days: 14

      - name: 上传 dtb（全部设备树）
        uses: actions/upload-artifact@v4
        with:
          name: dtb
          path: dtbs
          retention-days: 14