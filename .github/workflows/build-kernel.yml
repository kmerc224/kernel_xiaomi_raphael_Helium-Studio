name: Build Android Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04  # 推荐22.04，兼容性最好

    steps:
      # 1. 安装基础依赖 (完整编译环境)
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev unzip openjdk-8-jdk language-pack-zh-hans python2 python3 cpio p7zip-full
          sudo apt-get install -y gcc-aarch64-linux-gnu
          sudo apt-get install -y gcc-arm*
          
      # 2. 下载并解压 Clang 工具链（带 binutils）
      - name: 下载 Clang
        run: |
          mkdir -p $HOME/toolchain/clang
          cd $HOME/toolchain/clang
          wget https://github.com/Mandi-Sa/clang/releases/download/amd64-kernel-arm_static-19/llvm19.0.0-binutils2.42_amd64-kernel-arm_static-20240425.7z
          7z x llvm19.0.0-binutils2.42_amd64-kernel-arm_static-20240425.7z
          rm -rf llvm19.0.0-binutils2.42_amd64-kernel-arm_static-20240425.7z
          ls
      # 3. 检出内核源码 (此处可替换为自己的源码)
      - name: 检出内核源码
        run: |
        mkdir -p $HOME
        git clone --depth=1 -b oss-base https://github.com/kmerc224/kernel_xiaomi_raphael_Helium-Studio.git

      # 4. 设置编译环境变量 并 开始编译
      - name: 编译内核
        run: |
          cd $HOME/kernel_xiaomi_raphael_Helium-Studio
          export CC=clang
          export ARCH=arm64
          export PATH="$HOME/toolchain/clang/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          
          make O=out raphael_defconfig
          make O=out -j8

      # 5. 打包产物 (将生成的文件收集到统一目录)
      # 6. 打包产物 (保持不变，但确保文件复制正确)
      - name: 打包产物
        run: |
          cd $HOME
          mkdir -p output
          cp $HOME/kernel_xiaomi_raphael_Helium-Studio/out/arch/arm64/boot/Image.gz output/
          cp $HOME/kernel_xiaomi_raphael_Helium-Studio/out/arch/arm64/boot/Image output/
          cp $HOME/kernel_xiaomi_raphael_Helium-Studio/out/arch/arm64/boot/dtb.img output/ 2>/dev/null || true
          cp $HOME/kernel_xiaomi_raphael_Helium-Studio/out/arch/arm64/boot/dtbo.img output/ 2>/dev/null || true
          echo "产物已打包至 output/"

# 7. 创建 Release 并上传文件 (新增)
      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
    # 版本号：如果手动触发，从输入获取；如果是 tag 推送，可自动获取
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: 内核编译产物 ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            本次编译的内核镜像，包含：
             - Image.gz（压缩内核）
             - Image（未压缩内核）
             - dtb.img / dtbo.img（设备树，若有）
          files: output/*   # 上传 output 目录下的所有文件
          draft: false
          prerelease: false
         env:
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
