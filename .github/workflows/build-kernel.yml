name: Build Android Kernel

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release 标签（例如 v1.0）'
        required: true
        type: string

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    # 授予创建 Release 和上传产物的权限
    permissions:
      contents: write

    steps:
      # 1. 安装基础编译依赖（精简并明确包名）
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev unzip openjdk-8-jdk language-pack-zh-hans python2 python3 cpio p7zip-full
          sudo apt-get install -y gcc-aarch64-linux-gnu
          sudo apt-get install -y gcc-arm*

      # 2. 下载并解压 Clang 工具链（保留原链接）
      - name: 下载 Clang
        run: |
          mkdir -p $HOME/toolchain/clang
          cd $HOME/toolchain/clang
          wget https://github.com/Mandi-Sa/clang/releases/download/amd64-kernel-arm_static-19/llvm19.0.0-binutils2.42_amd64-kernel-arm_static-20240425.7z
          7z x llvm19.0.0-binutils2.42_amd64-kernel-arm_static-20240425.7z
          rm -f llvm19.0.0-binutils2.42_amd64-kernel-arm_static-20240425.7z

      # 3. 检出内核源码（克隆到 GITHUB_WORKSPACE，即当前工作目录）
      - name: 检出内核源码
        run: |
          git clone --depth=1 -b oss-base https://github.com/kmerc224/kernel_xiaomi_raphael_Helium-Studio.git

      # 4. 设置环境并编译内核（使用 LLVM=1 统一工具链）
      - name: 编译内核
        run: |
          set -e  # 出错即停
          cd kernel_xiaomi_raphael_Helium-Studio
          export PATH="$HOME/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export LLVM=1
          export LLVM_IAS=1

          make O=out raphael_defconfig
          make O=out -j$(nproc)

      # 5. 打包产物（统一放到 GITHUB_WORKSPACE/output 下）
      - name: 打包产物
        run: |
          set -e
          mkdir -p output
          cd kernel_xiaomi_raphael_Helium-Studio/out/arch/arm64/boot/
          cp -v Image.gz ../../../../output/  # 相对路径回到项目根目录
          cp -v Image ../../../../output/
          cp -v dtb.img ../../../../output/ 2>/dev/null || true
          cp -v dtbo.img ../../../../output/ 2>/dev/null || true
          echo "产物已打包至 $GITHUB_WORKSPACE/output"

      # 6. 创建 Release 并上传文件
      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: 内核编译产物 ${{ github.event.inputs.release_tag }}
          body: |
            本次编译的内核镜像，包含：
            - Image.gz（压缩内核）
            - Image（未压缩内核）
            - dtb.img / dtbo.img（设备树，若有）
          files: output/*
          draft: false
          prerelease: false