name: Build Helium Studio Kernel (raphael)

on:
  push:
    branches: [oss-base]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [oss-base]
  workflow_dispatch:
    inputs:
      defconfig:
        description: '内核配置 (defconfig)'
        required: true
        type: choice
        default: 'raphael_defconfig'
        options:
          - raphael_defconfig
          - raphael-vts_defconfig
      ksu:
        description: '集成 KernelSU'
        required: false
        type: boolean
        default: true

env:
  KERNEL_REPO: https://github.com/HeliumStudio-Dev/kernel_xiaomi_raphael.git
  KERNEL_BRANCH: oss-base
  ARCH: arm64
  DEFCONFIG: raphael_defconfig
  # Mandi-Sa Clang 下载地址 (LLVM 22.0.0 + binutils 2.45.1, 静态链接)
  CLANG_URL: https://github.com/Mandi-Sa/clang/releases/download/amd64-kernel-arm_static-22/llvm22.0.0-binutils2.45.1_amd64-kernel-arm_static-20260111.7z
  CLANG_DIR: /opt/mandi-clang

jobs:
  build:
    name: 编译内核 | ${{ inputs.defconfig || 'raphael_defconfig' }}
    runs-on: ubuntu-22.04

    steps:
      # ============================================
      # Step 1: 检出内核源码
      # ============================================
      - name: 检出内核源码
        uses: actions/checkout@v4
        with:
          repository: HeliumStudio-Dev/kernel_xiaomi_raphael
          ref: oss-base
          path: kernel
          fetch-depth: 0

      # ============================================
      # Step 2: 安装系统依赖 + 下载 Mandi-Sa Clang
      # ============================================
      - name: 安装依赖与 Mandi-Sa Clang 工具链
        run: |
          echo ">>> 安装系统依赖..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git make flex bison bc \
            libssl-dev libelf-dev cpio \
            xz-utils zip unzip p7zip-full \
            python3 wget ca-certificates \
            device-tree-compiler libyaml-dev

          echo ""
          echo ">>> 下载 Mandi-Sa Clang (LLVM 22 + binutils 2.45.1)..."
          sudo mkdir -p ${CLANG_DIR}
          cd /tmp
          wget -q --show-progress "${CLANG_URL}" -O mandi-clang.7z
          echo ">>> 解压中..."
          sudo 7z x -o${CLANG_DIR} mandi-clang.7z -y > /dev/null
          rm mandi-clang.7z

          # 验证工具链
          echo ""
          echo "=== Mandi-Sa Clang 工具链版本 ==="
          export PATH="${CLANG_DIR}/bin:${PATH}"
          clang --version | head -1
          ld.lld --version | head -1
          llvm-ar --version | head -1
          echo "=== 工具链就绪 ==="

      # ============================================
      # Step 3: 集成 KernelSU
      # ============================================
      - name: 集成 KernelSU
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ksu || github.event_name != 'workflow_dispatch' }}
        run: |
          cd ${{ github.workspace }}/kernel
          rm -rf KernelSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s -- --cleanup
          echo "KERNELSU_INTEGRATED=true" >> $GITHUB_ENV

      # ============================================
      # Step 4: 编译内核
      # ============================================
      - name: 编译内核
        run: |
          cd ${{ github.workspace }}/kernel

          # 将 Mandi-Sa Clang 加入 PATH
          export PATH="${CLANG_DIR}/bin:${PATH}"

          DEFCONFIG="${{ inputs.defconfig || env.DEFCONFIG }}"
          echo "使用配置: ${DEFCONFIG}"

          # 编译环境变量
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo ">>> 生成内核配置: ${DEFCONFIG}"
          make LLVM=1 O=out ${DEFCONFIG}

          # 启用 KernelSU
          if [ "${KERNELSU_INTEGRATED}" = "true" ]; then
            echo ">>> 启用 KernelSU"
            ./scripts/config --file out/.config --enable CONFIG_KSU
            make LLVM=1 O=out olddefconfig
          fi

          # 开始编译
          echo ">>> 开始编译内核 (Mandi-Sa Clang LLVM 22)..."
          make LLVM=1 O=out -j$(nproc --all) HOSTLDFLAGS="-lyaml" 2>&1 | tee build.log

          # 检查编译结果
          if [ ! -f out/arch/arm64/boot/Image.gz ] && [ ! -f out/arch/arm64/boot/Image ]; then
            echo ">>> 编译失败！Image / Image.gz 均未生成"
            echo "=== 编译日志末尾 (最后 150 行) ==="
            tail -150 build.log
            exit 1
          fi

          echo ">>> 编译成功！"
          ls -lh out/arch/arm64/boot/Image*
          make LLVM=1 HOSTLDFLAGS='-lyaml' kernelversion > ${{ github.workspace }}/kernel-version.txt

      # ============================================
      # Step 5: 打包产物
      # ============================================
      - name: 打包产物
        run: |
          cd ${{ github.workspace }}/kernel

          OUTPUT_DIR=${{ github.workspace }}/output
          mkdir -p ${OUTPUT_DIR}

          # 复制内核镜像
          cp out/arch/arm64/boot/Image.gz-dtb ${OUTPUT_DIR}/Image.gz-dtb
          cp out/arch/arm64/boot/Image.gz ${OUTPUT_DIR}/Image.gz
          cp out/arch/arm64/boot/Image ${OUTPUT_DIR}/Image 2>/dev/null || true

          # 复制内核模块
          mkdir -p ${OUTPUT_DIR}/modules
          find out -name "*.ko" -exec cp {} ${OUTPUT_DIR}/modules/ \; 2>/dev/null || true

          # ============================================
          # 下载 magiskboot (PC x86_64 版本 + Android ARM64 版本)
          # ============================================
          echo ">>> 下载 magiskboot..."
          wget -q "https://github.com/Uevo001/magiskboot-linux/raw/refs/heads/main/x86_64/magiskboot" -O ${OUTPUT_DIR}/magiskboot-x86_64
          chmod +x ${OUTPUT_DIR}/magiskboot-x86_64

          # 从 Magisk APK 中提取 ARM64 版本的 magiskboot
          wget -q "https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk" -O /tmp/magisk.apk
          unzip -qo /tmp/magisk.apk -d /tmp/magisk_apk/
          cp /tmp/magisk_apk/lib/arm64-v8a/libmagiskboot.so ${OUTPUT_DIR}/magiskboot-arm64 2>/dev/null || true
          chmod +x ${OUTPUT_DIR}/magiskboot-arm64 2>/dev/null || true

          # ============================================
          # 创建电脑端 ADB 刷入脚本
          # ============================================
          cat > ${OUTPUT_DIR}/rebuild.sh << 'REBUILDSCRIPT'
          #!/usr/bin/env bash
          # ================================================================
          # Helium Kernel 手动刷入脚本 (电脑端 ADB)
          # 用法: 手机进 TWRP → 连电脑 → 运行此脚本
          # ================================================================
          set -e

          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          MAGISKBOOT="${SCRIPT_DIR}/magiskboot-x86_64"
          KERNEL="${SCRIPT_DIR}/Image.gz-dtb"

          echo ">>> 检查 ADB 连接..."
          adb devices | grep -q "recovery" || { echo "请先进入 TWRP 并连接电脑!"; exit 1; }

          echo ">>> 从手机拉取当前 boot.img..."
          adb shell "dd if=/dev/block/bootdevice/by-name/boot of=/tmp/boot.img"
          adb pull /tmp/boot.img /tmp/boot.img
          cp /tmp/boot.img /tmp/boot-orig.img

          echo ">>> 用 magiskboot 解包 boot.img..."
          "${MAGISKBOOT}" unpack /tmp/boot.img

          echo ">>> 替换内核为 Helium Image.gz-dtb..."
          cp "${KERNEL}" /tmp/kernel

          echo ">>> 重新打包 boot.img..."
          "${MAGISKBOOT}" repack /tmp/boot.img

          echo ">>> 推回手机..."
          adb push /tmp/new-boot.img /tmp/new-boot.img

          echo ">>> 刷入 boot 分区..."
          adb shell "dd if=/tmp/new-boot.img of=/dev/block/bootdevice/by-name/boot"

          echo ""
          echo "======================================"
          echo "  刷入完成！"
          echo "  原始 boot.img 备份: /tmp/boot-orig.img"
          echo "  请重启手机: adb reboot"
          echo "======================================"
          REBUILDSCRIPT
          chmod +x ${OUTPUT_DIR}/rebuild.sh

          # ============================================
          # 创建 TWRP 直接刷入包 (不使用 AK3, 用 magiskboot-arm64)
          # ============================================
          echo ">>> 创建 TWRP 刷入包..."
          mkdir -p /tmp/twrp_zip/META-INF/com/google/android/

          # 直接用 shell 脚本当 update-binary (TWRP 支持)
          cat > /tmp/twrp_zip/META-INF/com/google/android/update-binary << 'TWRPSCRIPT'
          #!/sbin/sh
          # ================================================================
          # Helium Kernel TWRP 刷入脚本
          # 使用 magiskboot 手动解包/替换内核/重新打包
          # ================================================================
          OUTFD=$2
          ZIPFILE=$3

          ui_print() {
            echo -e "ui_print $1\nui_print" >> /proc/self/fd/$OUTFD
          }

          ui_print "======================================"
          ui_print " Helium Studio Kernel for raphael"
          ui_print "======================================"

          # 解压文件
          ui_print "解压中..."
          unzip -o "$ZIPFILE" -d /tmp/helium_kernel/ > /dev/null
          chmod +x /tmp/helium_kernel/magiskboot-arm64

          # 备份当前 boot
          ui_print "备份当前 boot.img..."
          dd if=/dev/block/bootdevice/by-name/boot of=/tmp/helium_kernel/boot-backup.img

          # 解包
          ui_print "解包 boot.img..."
          /tmp/helium_kernel/magiskboot-arm64 unpack /tmp/helium_kernel/boot-backup.img

          # 替换内核
          ui_print "替换内核..."
          cp /tmp/helium_kernel/Image.gz-dtb /tmp/helium_kernel/kernel

          # 重新打包
          ui_print "重新打包..."
          /tmp/helium_kernel/magiskboot-arm64 repack /tmp/helium_kernel/boot-backup.img

          # 刷入
          ui_print "刷入 boot 分区..."
          dd if=/tmp/helium_kernel/new-boot.img of=/dev/block/bootdevice/by-name/boot

          ui_print ""
          ui_print "======================================"
          ui_print " 刷入完成!"
          ui_print " 备份: /tmp/helium_kernel/boot-backup.img"
          ui_print "======================================"
          TWRPSCRIPT
          chmod 755 /tmp/twrp_zip/META-INF/com/google/android/update-binary

          # 空 updater-script (TWRP 需要此文件存在)
          echo "# dummy" > /tmp/twrp_zip/META-INF/com/google/android/updater-script

          # 放入内核和 magiskboot
          cp ${OUTPUT_DIR}/Image.gz-dtb /tmp/twrp_zip/Image.gz-dtb
          cp ${OUTPUT_DIR}/magiskboot-arm64 /tmp/twrp_zip/magiskboot-arm64

          cd /tmp/twrp_zip
          zip -r9 ${OUTPUT_DIR}/Helium-Kernel-raphael-$(date +%Y%m%d).zip ./*
          cd ${{ github.workspace }}

          echo ">>> 产物列表:"
          ls -lh ${OUTPUT_DIR}/

      # ============================================
      # Step 6: 上传构建产物
      # ============================================
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Helium-Kernel-raphael-${{ github.run_id }}
          path: ${{ github.workspace }}/output/
          retention-days: 30
          compression-level: 6

      # ============================================
      # Step 7: 创建 Release
      # ============================================
      - name: 创建 Release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/oss-base' }}
        uses: softprops/action-gh-release@v1
        with:
          name: "Helium Kernel r${{ github.run_number }}"
          tag_name: "r${{ github.run_number }}"
          body: |
            ## Helium Studio Kernel for Redmi K20 Pro (raphael)

            - **内核版本**: `$(cat ${{ github.workspace }}/kernel-version.txt)`
            - **架构**: arm64
            - **编译工具链**: Mandi-Sa Clang (LLVM 22.0.0 + binutils 2.45.1)
            - **KernelSU**: ${{ env.KERNELSU_INTEGRATED || 'false' }}
            - **构建日期**: $(date +%Y-%m-%d)

            ### 刷入方法
            1. 进入 TWRP / OrangeFox Recovery
            2. 刷入 `Helium-Kernel-raphael-*.zip`
            3. 重启系统

            ### 注意
            - 仅适用于 Redmi K20 Pro / Mi 9T Pro (raphael)
            - 刷入前请备份 `boot` 和 `dtbo` 分区
          files: ${{ github.workspace }}/output/Helium-Kernel-raphael-*.zip
          draft: false
          prerelease: false