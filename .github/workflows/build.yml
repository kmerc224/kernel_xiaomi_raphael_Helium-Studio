name: Build Helium Studio Kernel (raphael)

on:
  push:
    branches: [oss-base]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [oss-base]
  workflow_dispatch:
    inputs:
      defconfig:
        description: '内核配置 (defconfig)'
        required: true
        type: choice
        default: 'raphael_defconfig'
        options:
          - raphael_defconfig
          - raphael-vts_defconfig
      ksu:
        description: '集成 KernelSU'
        required: false
        type: boolean
        default: true

env:
  KERNEL_REPO: https://github.com/HeliumStudio-Dev/kernel_xiaomi_raphael.git
  KERNEL_BRANCH: oss-base
  ARCH: arm64
  DEFCONFIG: raphael_defconfig
  # Mandi-Sa Clang 下载地址 (LLVM 22.0.0 + binutils 2.45.1, 静态链接)
  CLANG_URL: https://github.com/Mandi-Sa/clang/releases/download/amd64-kernel-arm_static-22/llvm22.0.0-binutils2.45.1_amd64-kernel-arm_static-20260111.7z
  CLANG_DIR: /opt/mandi-clang

jobs:
  build:
    name: 编译内核 | ${{ inputs.defconfig || 'raphael_defconfig' }}
    runs-on: ubuntu-22.04

    steps:
      # ============================================
      # Step 1: 检出内核源码
      # ============================================
      - name: 检出内核源码
        uses: actions/checkout@v4
        with:
          repository: HeliumStudio-Dev/kernel_xiaomi_raphael
          ref: oss-base
          path: kernel
          fetch-depth: 0

      # ============================================
      # Step 2: 安装系统依赖 + 下载 Mandi-Sa Clang
      # ============================================
      - name: 安装依赖与 Mandi-Sa Clang 工具链
        run: |
          echo ">>> 安装系统依赖..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git make flex bison bc \
            libssl-dev libelf-dev cpio \
            xz-utils zip unzip p7zip-full \
            python3 wget ca-certificates \
            device-tree-compiler libyaml-dev

          echo ""
          echo ">>> 下载 Mandi-Sa Clang (LLVM 22 + binutils 2.45.1)..."
          sudo mkdir -p ${CLANG_DIR}
          cd /tmp
          wget -q --show-progress "${CLANG_URL}" -O mandi-clang.7z
          echo ">>> 解压中..."
          sudo 7z x -o${CLANG_DIR} mandi-clang.7z -y > /dev/null
          rm mandi-clang.7z

          # 验证工具链
          echo ""
          echo "=== Mandi-Sa Clang 工具链版本 ==="
          export PATH="${CLANG_DIR}/bin:${PATH}"
          clang --version | head -1
          ld.lld --version | head -1
          llvm-ar --version | head -1
          echo "=== 工具链就绪 ==="

      # ============================================
      # Step 3: 集成 KernelSU
      # ============================================
      - name: 集成 KernelSU
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ksu || github.event_name != 'workflow_dispatch' }}
        run: |
          cd ${{ github.workspace }}/kernel
          rm -rf KernelSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s -- --cleanup
          echo "KERNELSU_INTEGRATED=true" >> $GITHUB_ENV

      # ============================================
      # Step 4: 编译内核
      # ============================================
      - name: 编译内核
        run: |
          cd ${{ github.workspace }}/kernel

          # 将 Mandi-Sa Clang 加入 PATH
          export PATH="${CLANG_DIR}/bin:${PATH}"

          DEFCONFIG="${{ inputs.defconfig || env.DEFCONFIG }}"
          echo "使用配置: ${DEFCONFIG}"

          # 编译环境变量
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo ">>> 生成内核配置: ${DEFCONFIG}"
          make LLVM=1 O=out ${DEFCONFIG}

          # 启用 KernelSU
          if [ "${KERNELSU_INTEGRATED}" = "true" ]; then
            echo ">>> 启用 KernelSU"
            ./scripts/config --file out/.config --enable CONFIG_KSU
            make LLVM=1 O=out olddefconfig
          fi

          # 开始编译
          echo ">>> 开始编译内核 (Mandi-Sa Clang LLVM 22)..."
          make LLVM=1 O=out -j$(nproc --all) HOSTLDFLAGS="-lyaml" 2>&1 | tee build.log

          # 检查编译结果
          if [ ! -f out/arch/arm64/boot/Image.gz ] && [ ! -f out/arch/arm64/boot/Image ]; then
            echo ">>> 编译失败！Image / Image.gz 均未生成"
            echo "=== 编译日志末尾 (最后 150 行) ==="
            tail -150 build.log
            exit 1
          fi

          echo ">>> 编译成功！"
          ls -lh out/arch/arm64/boot/Image*
          make LLVM=1 HOSTLDFLAGS='-lyaml' kernelversion > ${{ github.workspace }}/kernel-version.txt

      # ============================================
      # Step 5: 打包产物
      # ============================================
      - name: 打包产物
        run: |
          cd ${{ github.workspace }}/kernel

          OUTPUT_DIR=${{ github.workspace }}/output
          mkdir -p ${OUTPUT_DIR}

          # 复制内核镜像
          cp out/arch/arm64/boot/Image.gz ${OUTPUT_DIR}/Image.gz
          cp out/arch/arm64/boot/Image.gz-dtb ${OUTPUT_DIR}/Image.gz-dtb
          cp out/arch/arm64/boot/Image ${OUTPUT_DIR}/Image 2>/dev/null || true
          cp out/vmlinux ${OUTPUT_DIR}/vmlinux 2>/dev/null || true

          # 复制 DTB
          if ls out/arch/arm64/boot/dts/vendor/qcom/*.dtb 1>/dev/null 2>&1; then
            mkdir -p ${OUTPUT_DIR}/dtb
            cp out/arch/arm64/boot/dts/vendor/qcom/*.dtb ${OUTPUT_DIR}/dtb/ 2>/dev/null || true
          fi

          # 复制内核模块
          mkdir -p ${OUTPUT_DIR}/modules
          find out -name "*.ko" -exec cp {} ${OUTPUT_DIR}/modules/ \; 2>/dev/null || true

          # 打包 AnyKernel3
          echo ">>> 创建 AnyKernel3 刷机包..."
          wget -q "https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip" -O /tmp/ak3.zip
          unzip -qo /tmp/ak3.zip -d /tmp/

          # 关键修复：使用 Image.gz-dtb（含设备树），而非 Image.gz（不含 DTB，导致卡第一屏）
          cp ${OUTPUT_DIR}/Image.gz-dtb /tmp/AnyKernel3-master/Image.gz-dtb
          cp -r ${OUTPUT_DIR}/dtb /tmp/AnyKernel3-master/ 2>/dev/null || true

          cat > /tmp/AnyKernel3-master/anykernel.sh << 'AK3SH'
          # AnyKernel3 配置
          kernel.string="Helium Studio Kernel for Redmi K20 Pro (raphael)"
          device.name1=raphael
          device.name2=raphaelin
          device.name3=raphaels
          block=/dev/block/bootdevice/by-name/boot
          is_slot_device=0
          ramdisk_compression=auto
          # 使用 Image.gz-dtb 而非 Image.gz，确保 DTB 正确注入
          AK3SH

          cd /tmp/AnyKernel3-master
          zip -r9 ${OUTPUT_DIR}/Helium-Kernel-raphael-$(date +%Y%m%d).zip ./* -x "*.git*" -x "README.md"
          cd ${{ github.workspace }}

          echo ">>> 产物列表:"
          ls -lh ${OUTPUT_DIR}/

      # ============================================
      # Step 6: 上传构建产物
      # ============================================
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Helium-Kernel-raphael-${{ github.run_id }}
          path: ${{ github.workspace }}/output/
          retention-days: 30
          compression-level: 6

      # ============================================
      # Step 7: 创建 Release
      # ============================================
      - name: 创建 Release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/oss-base' }}
        uses: softprops/action-gh-release@v1
        with:
          name: "Helium Kernel r${{ github.run_number }}"
          tag_name: "r${{ github.run_number }}"
          body: |
            ## Helium Studio Kernel for Redmi K20 Pro (raphael)

            - **内核版本**: `$(cat ${{ github.workspace }}/kernel-version.txt)`
            - **架构**: arm64
            - **编译工具链**: Mandi-Sa Clang (LLVM 22.0.0 + binutils 2.45.1)
            - **KernelSU**: ${{ env.KERNELSU_INTEGRATED || 'false' }}
            - **构建日期**: $(date +%Y-%m-%d)

            ### 刷入方法
            1. 进入 TWRP / OrangeFox Recovery
            2. 刷入 `Helium-Kernel-raphael-*.zip`
            3. 重启系统

            ### 注意
            - 仅适用于 Redmi K20 Pro / Mi 9T Pro (raphael)
            - 刷入前请备份 `boot` 和 `dtbo` 分区
          files: ${{ github.workspace }}/output/Helium-Kernel-raphael-*.zip
          draft: false
          prerelease: false