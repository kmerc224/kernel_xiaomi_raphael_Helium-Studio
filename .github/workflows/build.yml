name: Build Helium Studio Kernel (raphael)

on:
  push:
    branches: [oss-base]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [oss-base]
  workflow_dispatch:
    inputs:
      defconfig:
        description: '内核配置 (defconfig)'
        required: true
        type: choice
        default: 'raphael_defconfig'
        options:
          - raphael_defconfig
          - raphael-vts_defconfig
      ksu:
        description: '集成 KernelSU'
        required: false
        type: boolean
        default: true
      lto:
        description: '启用 LTO (链接时优化)'
        required: false
        type: boolean
        default: true

env:
  # 内核源码仓库
  KERNEL_REPO: https://github.com/HeliumStudio-Dev/kernel_xiaomi_raphael.git
  KERNEL_BRANCH: oss-base
  # 编译配置
  ARCH: arm64
  DEFCONFIG: raphael_defconfig
  # Clang 工具链
  CLANG_VERSION: r522817

jobs:
  build:
    name: 编译内核 | ${{ inputs.defconfig || 'raphael_defconfig' }}
    runs-on: ubuntu-22.04

    steps:
      # ============================================
      # Step 1: 检出内核源码
      # ============================================
      - name: 检出内核源码
        uses: actions/checkout@v4
        with:
          repository: HeliumStudio-Dev/kernel_xiaomi_raphael
          ref: oss-base
          path: kernel
          fetch-depth: 0

      # ============================================
      # Step 2: 安装编译依赖 + 工具链
      # ============================================
      - name: 安装编译依赖与工具链
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git make flex bison bc \
            libssl-dev libelf-dev cpio \
            xz-utils zip unzip \
            python3 wget ca-certificates \
            device-tree-compiler libyaml-dev \
            clang-15 lld-15 llvm-15 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

          # 创建符号链接，让 make 可以直接找到 clang / ld.lld 等
          sudo update-alternatives --install /usr/bin/clang        clang        /usr/bin/clang-15        100
          sudo update-alternatives --install /usr/bin/clang++      clang++      /usr/bin/clang++-15      100
          sudo update-alternatives --install /usr/bin/ld.lld       ld.lld       /usr/bin/ld.lld-15       100
          sudo update-alternatives --install /usr/bin/llvm-ar      llvm-ar      /usr/bin/llvm-ar-15      100
          sudo update-alternatives --install /usr/bin/llvm-nm      llvm-nm      /usr/bin/llvm-nm-15      100
          sudo update-alternatives --install /usr/bin/llvm-objcopy llvm-objcopy /usr/bin/llvm-objcopy-15 100
          sudo update-alternatives --install /usr/bin/llvm-objdump llvm-objdump /usr/bin/llvm-objdump-15 100
          sudo update-alternatives --install /usr/bin/llvm-readelf llvm-readelf /usr/bin/llvm-readelf-15 100
          sudo update-alternatives --install /usr/bin/llvm-strip   llvm-strip   /usr/bin/llvm-strip-15   100

          # 验证工具链
          echo "=== 工具链版本 ==="
          clang --version | head -1
          ld.lld --version | head -1
          aarch64-linux-gnu-gcc --version | head -1
          arm-linux-gnueabi-gcc --version | head -1

      # ============================================
      # Step 4: 集成 KernelSU (可选)
      # ============================================
      - name: 集成 KernelSU
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ksu || github.event_name != 'workflow_dispatch' }}
        run: |
          cd ${{ github.workspace }}/kernel
          rm -rf KernelSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s -- --cleanup
          echo "KERNELSU_INTEGRATED=true" >> $GITHUB_ENV

      # ============================================
      # Step 5: 编译内核
      # ============================================
      - name: 编译内核
        run: |
          cd ${{ github.workspace }}/kernel

          # 确定使用的 defconfig
          DEFCONFIG="${{ inputs.defconfig || env.DEFCONFIG }}"
          echo "使用配置: ${DEFCONFIG}"

          # 工具链已在系统中通过 apt 安装，无需额外 PATH 设置
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # 生成配置
          echo ">>> 生成内核配置: ${DEFCONFIG}"
          make LLVM=1 O=out ${DEFCONFIG}

          # 如果有 KernelSU, 启用相关配置
          if [ "${KERNELSU_INTEGRATED}" = "true" ]; then
            echo ">>> 启用 KernelSU"
            ./scripts/config --file out/.config --enable CONFIG_KSU
            make LLVM=1 O=out olddefconfig
          fi

          # 开始编译
          echo ">>> 开始编译内核..."
          make LLVM=1 O=out -j$(nproc --all) 2>&1 | tee build.log

          # 检查编译结果
          if [ ! -f out/arch/arm64/boot/Image.gz ] && [ ! -f out/arch/arm64/boot/Image ]; then
            echo ">>> 编译失败！Image / Image.gz 均未生成"
            echo "=== 编译日志末尾 (最后 150 行) ==="
            tail -150 build.log
            exit 1
          fi

          echo ">>> 编译成功！"
          ls -lh out/arch/arm64/boot/Image*
          echo "KERNEL_VERSION=$(make LLVM=1 kernelversion)" >> $GITHUB_ENV

      # ============================================
      # Step 6: 打包产物
      # ============================================
      - name: 打包产物
        run: |
          cd ${{ github.workspace }}/kernel

          OUTPUT_DIR=${{ github.workspace }}/output
          mkdir -p ${OUTPUT_DIR}

          # 复制内核镜像
          cp out/arch/arm64/boot/Image.gz ${OUTPUT_DIR}/Image.gz
          cp out/arch/arm64/boot/Image ${OUTPUT_DIR}/Image
          cp out/vmlinux ${OUTPUT_DIR}/vmlinux

          # 复制 DTB / DTBO
          if [ -f out/arch/arm64/boot/dts/vendor/qcom/*.dtb ]; then
            mkdir -p ${OUTPUT_DIR}/dtb
            cp out/arch/arm64/boot/dts/vendor/qcom/*.dtb ${OUTPUT_DIR}/dtb/ 2>/dev/null || true
          fi

          # 复制内核模块
          mkdir -p ${OUTPUT_DIR}/modules
          find out -name "*.ko" -exec cp {} ${OUTPUT_DIR}/modules/ \; 2>/dev/null || true

          # 打包 AnyKernel3 格式
          echo ">>> 创建 AnyKernel3 刷机包..."
          mkdir -p ${OUTPUT_DIR}/anykernel
          # 下载 AnyKernel3 模板
          wget -q "https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip" -O /tmp/ak3.zip
          unzip -qo /tmp/ak3.zip -d /tmp/

          cp ${OUTPUT_DIR}/Image.gz /tmp/AnyKernel3-master/Image.gz
          cp -r ${OUTPUT_DIR}/dtb /tmp/AnyKernel3-master/ 2>/dev/null || true

          # 生成 anykernel.sh 配置
          cat > /tmp/AnyKernel3-master/anykernel.sh << 'AK3SH'
          # AnyKernel3 配置
          kernel.string="Helium Studio Kernel for Redmi K20 Pro (raphael)"
          device.name1=raphael
          device.name2=raphaelin
          device.name3=raphaels
          block=/dev/block/bootdevice/by-name/boot
          is_slot_device=0
          ramdisk_compression=auto
          AK3SH

          cd /tmp/AnyKernel3-master
          zip -r9 ${OUTPUT_DIR}/Helium-Kernel-raphael-$(date +%Y%m%d).zip ./* -x "*.git*" -x "README.md"
          cd ${{ github.workspace }}

          echo ">>> 产物列表:"
          ls -lh ${OUTPUT_DIR}/

      # ============================================
      # Step 7: 上传构建产物
      # ============================================
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Helium-Kernel-raphael-${{ github.run_id }}
          path: ${{ github.workspace }}/output/
          retention-days: 30
          compression-level: 6

      # ============================================
      # Step 8: 创建 Release (仅 push 到 oss-base 时)
      # ============================================
      - name: 创建 Release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/oss-base' }}
        uses: softprops/action-gh-release@v1
        with:
          name: "Helium Kernel r${{ github.run_number }}"
          tag_name: "r${{ github.run_number }}"
          body: |
            ## Helium Studio Kernel for Redmi K20 Pro (raphael)

            - **内核版本**: `${{ env.KERNEL_VERSION }}`
            - **架构**: arm64
            - **编译工具链**: Clang ${{ env.CLANG_VERSION }}
            - **KernelSU**: ${{ env.KERNELSU_INTEGRATED || 'false' }}
            - **构建日期**: $(date +%Y-%m-%d)

            ### 刷入方法
            1. 进入 TWRP / OrangeFox Recovery
            2. 刷入 `Helium-Kernel-raphael-*.zip`
            3. 重启系统

            ### 注意
            - 仅适用于 Redmi K20 Pro / Mi 9T Pro (raphael)
            - 刷入前请备份 `boot` 和 `dtbo` 分区
          files: ${{ github.workspace }}/output/Helium-Kernel-raphael-*.zip
          draft: false
          prerelease: false