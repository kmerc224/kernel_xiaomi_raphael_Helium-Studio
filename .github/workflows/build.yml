name: Build Helium Studio Kernel (raphael)

on:
  push:
    branches: [oss-base]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [oss-base]
  workflow_dispatch:
    inputs:
      defconfig:
        description: '内核配置 (defconfig)'
        required: true
        type: choice
        default: 'raphael_defconfig'
        options:
          - raphael_defconfig
          - raphael-vts_defconfig
      ksu:
        description: '集成 KernelSU'
        required: false
        type: boolean
        default: true

env:
  KERNEL_REPO: https://github.com/HeliumStudio-Dev/kernel_xiaomi_raphael.git
  KERNEL_BRANCH: oss-base
  ARCH: arm64
  DEFCONFIG: raphael_defconfig
  # Mandi-Sa Clang 下载地址 (LLVM 22.0.0 + binutils 2.45.1, 静态链接)
  CLANG_URL: https://github.com/Mandi-Sa/clang/releases/download/amd64-kernel-arm_static-22/llvm22.0.0-binutils2.45.1_amd64-kernel-arm_static-20260111.7z
  CLANG_DIR: /opt/mandi-clang

jobs:
  build:
    name: 编译内核 | ${{ inputs.defconfig || 'raphael_defconfig' }}
    runs-on: ubuntu-22.04

    steps:
      # ============================================
      # Step 1: 检出内核源码
      # ============================================
      - name: 检出内核源码
        uses: actions/checkout@v4
        with:
          repository: HeliumStudio-Dev/kernel_xiaomi_raphael
          ref: oss-base
          path: kernel
          fetch-depth: 0

      # ============================================
      # Step 2: 安装系统依赖 + 下载 Mandi-Sa Clang
      # ============================================
      - name: 安装依赖与 Mandi-Sa Clang 工具链
        run: |
          echo ">>> 安装系统依赖..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git make flex bison bc \
            libssl-dev libelf-dev cpio \
            xz-utils zip unzip p7zip-full \
            python3 wget ca-certificates \
            device-tree-compiler libyaml-dev

          echo ""
          echo ">>> 下载 Mandi-Sa Clang (LLVM 22 + binutils 2.45.1)..."
          sudo mkdir -p ${CLANG_DIR}
          cd /tmp
          wget -q --show-progress "${CLANG_URL}" -O mandi-clang.7z
          echo ">>> 解压中..."
          sudo 7z x -o${CLANG_DIR} mandi-clang.7z -y > /dev/null
          rm mandi-clang.7z

          # 验证工具链
          echo ""
          echo "=== Mandi-Sa Clang 工具链版本 ==="
          export PATH="${CLANG_DIR}/bin:${PATH}"
          clang --version | head -1
          ld.lld --version | head -1
          llvm-ar --version | head -1
          echo "=== 工具链就绪 ==="

      # ============================================
      # Step 3: 集成 KernelSU
      # ============================================
      - name: 集成 KernelSU
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ksu || github.event_name != 'workflow_dispatch' }}
        run: |
          cd ${{ github.workspace }}/kernel
          rm -rf KernelSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s -- --cleanup
          echo "KERNELSU_INTEGRATED=true" >> $GITHUB_ENV

      # ============================================
      # Step 4: 编译内核
      # ============================================
      - name: 编译内核
        run: |
          cd ${{ github.workspace }}/kernel

          # 将 Mandi-Sa Clang 加入 PATH
          export PATH="${CLANG_DIR}/bin:${PATH}"

          DEFCONFIG="${{ inputs.defconfig || env.DEFCONFIG }}"
          echo "使用配置: ${DEFCONFIG}"

          # 编译环境变量
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo ">>> 生成内核配置: ${DEFCONFIG}"
          make LLVM=1 O=out ${DEFCONFIG}

          # 启用 KernelSU
          if [ "${KERNELSU_INTEGRATED}" = "true" ]; then
            echo ">>> 启用 KernelSU"
            ./scripts/config --file out/.config --enable CONFIG_KSU
            make LLVM=1 O=out olddefconfig
          fi

          # 开始编译
          echo ">>> 开始编译内核 (Mandi-Sa Clang LLVM 22)..."
          make LLVM=1 O=out -j$(nproc --all) HOSTLDFLAGS="-lyaml" 2>&1 | tee build.log

          # 检查编译结果
          if [ ! -f out/arch/arm64/boot/Image.gz ] && [ ! -f out/arch/arm64/boot/Image ]; then
            echo ">>> 编译失败！Image / Image.gz 均未生成"
            echo "=== 编译日志末尾 (最后 150 行) ==="
            tail -150 build.log
            exit 1
          fi

          echo ">>> 编译成功！"
          ls -lh out/arch/arm64/boot/Image*
          make LLVM=1 HOSTLDFLAGS='-lyaml' kernelversion > ${{ github.workspace }}/kernel-version.txt

      # ============================================
      # Step 5: 打包产物
      # ============================================
      - name: 打包产物
        run: |
          cd ${{ github.workspace }}/kernel/out/arch/arm64/boot
          ls

          cd ${{ github.workspace }}/kernel
          
          OUTPUT_DIR=${{ github.workspace }}/output
          mkdir -p ${OUTPUT_DIR}

          # 复制所有内核镜像产物
          cp out/arch/arm64/boot/Image ${OUTPUT_DIR}/Image
          cp out/arch/arm64/boot/Image.gz ${OUTPUT_DIR}/Image.gz
          cp out/arch/arm64/boot/Image.gz-dtb ${OUTPUT_DIR}/Image.gz-dtb
          cp out/arch/arm64/boot/dtb ${OUTPUT_DIR}/dtb
          cp out/arch/arm64/boot/dtbo.img ${OUTPUT_DIR}/dtbo.img

          # 复制内核模块
          mkdir -p ${OUTPUT_DIR}/modules
          find out -name "*.ko" -exec cp {} ${OUTPUT_DIR}/modules/ \; 2>/dev/null || true

          # 复制 .config
          cp out/.config ${OUTPUT_DIR}/config 2>/dev/null || true

          # ============================================
          # 创建 AnyKernel3 刷机包
          # ============================================
          echo ">>> 下载 AnyKernel3 模板..."
          wget -q "https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip" -O /tmp/ak3.zip
          unzip -qo /tmp/ak3.zip -d /tmp/
          AK3_DIR=/tmp/AnyKernel3-master

          # 1. 内核镜像 (Image.gz-dtb = bundled kernel + DTB)
          cp ${OUTPUT_DIR}/Image.gz-dtb ${AK3_DIR}/Image.gz-dtb

          # 2. dtbo.img (AK3 会自动刷入 dtbo 分区)
          if ls ${OUTPUT_DIR}/*.dtbo 1>/dev/null 2>&1; then
            cp ${OUTPUT_DIR}/*.dtbo ${AK3_DIR}/dtbo.img 2>/dev/null || true
          fi

          # 3. 内核模块 (do.modules=1 时 AK3 自动安装到 ramdisk)
          if [ -d ${OUTPUT_DIR}/modules ] && [ "$(ls ${OUTPUT_DIR}/modules/ 2>/dev/null)" ]; then
            mkdir -p ${AK3_DIR}/modules
            cp ${OUTPUT_DIR}/modules/*.ko ${AK3_DIR}/modules/ 2>/dev/null || true
          fi

          # 4. 额外产物放到 extras/ 目录 (不影响 AK3 逻辑)
          mkdir -p ${AK3_DIR}/extras
          cp ${OUTPUT_DIR}/Image.gz ${AK3_DIR}/extras/ 2>/dev/null || true
          cp ${OUTPUT_DIR}/Image ${AK3_DIR}/extras/ 2>/dev/null || true
          cp ${OUTPUT_DIR}/*.dtb ${AK3_DIR}/extras/ 2>/dev/null || true
          cp ${OUTPUT_DIR}/config ${AK3_DIR}/extras/ 2>/dev/null || true

          # 5. anykernel.sh — AK3 核心脚本
          # 关键: shell 变量必须大写 (ak3-core.sh 直接使用 $BLOCK 等)
          # file_getprop 属性用小写 (update-binary 从文件读取)
          cat > ${AK3_DIR}/anykernel.sh << 'AK3SH'
          # AnyKernel3 configuration for Helium Studio Kernel
          # file_getprop 属性 (update-binary 读取)
          kernel.string=Helium Studio Kernel for Redmi K20 Pro (raphael)
          device.name1=raphael
          device.name2=raphaelin
          device.name3=raphaels
          device.name4=raphael_global
          device.name5=raphael_cn
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=0
          do.cleanuponabort=0

          # shell 变量 — 必须大写，ak3-core.sh 直接引用
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # 导入 AK3 核心函数并执行刷入
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          AK3SH

          # 6. 打包
          cd ${AK3_DIR}
          AK3_ZIP="Helium-Kernel-raphael-$(date +%Y%m%d).zip"
          zip -r9 ${OUTPUT_DIR}/${AK3_ZIP} ./* -x "*.git*" -x "README.md"
          cd ${{ github.workspace }}

          echo ">>> AK3 包内容:"
          unzip -l ${OUTPUT_DIR}/${AK3_ZIP}

          echo ""
          echo ">>> 产物列表:"
          ls -lh ${OUTPUT_DIR}/

      # ============================================
      # Step 6: 上传构建产物
      # ============================================
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Helium-Kernel-raphael-${{ github.run_id }}
          path: ${{ github.workspace }}/output/
          retention-days: 30
          compression-level: 6

      # ============================================
      # Step 7: 创建 Release
      # ============================================
      - name: 创建 Release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/oss-base' }}
        uses: softprops/action-gh-release@v1
        with:
          name: "Helium Kernel r${{ github.run_number }}"
          tag_name: "r${{ github.run_number }}"
          body: |
            ## Helium Studio Kernel for Redmi K20 Pro (raphael)

            - **内核版本**: `$(cat ${{ github.workspace }}/kernel-version.txt)`
            - **架构**: arm64
            - **编译工具链**: Mandi-Sa Clang (LLVM 22.0.0 + binutils 2.45.1)
            - **KernelSU**: ${{ env.KERNELSU_INTEGRATED || 'false' }}
            - **构建日期**: $(date +%Y-%m-%d)

            ### 刷入 (AnyKernel3)
            1. 下载 `Helium-Kernel-raphael-*.zip`
            2. 进入 TWRP / OrangeFox Recovery
            3. 刷入 zip → 重启

            ### AK3 包内容
            - `Image.gz-dtb` — 内核 + 设备树（bundled）
            - `dtbo.img` — DTBO 叠加层
            - `extras/` — Image.gz, Image, dtb 文件, config
            - `modules/` — 内核模块 (.ko)

            ### 注意
            - 仅适用于 Redmi K20 Pro / Mi 9T Pro (raphael)
            - 刷入前请备份 `boot` 分区
          files: ${{ github.workspace }}/output/Helium-Kernel-raphael-*.zip
          draft: false
          prerelease: false